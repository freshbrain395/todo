[project]
name = "todo-agent"
version = "0.1.0"
description = "A Python & SQLite based intelligent TODO Agent with multi-LLM support and Windows desktop notifications"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "pytest>=7.0.0",
    "pyqt6>=6.5.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
