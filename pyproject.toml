[project]
name = "todo-agent"
version = "0.1.0"
description = "Todo Agent Python Backend and CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "prompt-toolkit>=3.0.43",
    "rich>=13.7.0",
    "platformdirs>=4.2.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
todo-server = "backend.main:run_server"
todo-cli = "backend.cli:run_cli"
todo = "backend.cli:run_cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
